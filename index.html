<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pregame</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600&family=Doto:wght@900&display=swap" rel="stylesheet">
  <link rel="icon" href="app/icon.png">
  <!-- Phone home screen: iOS uses the touch icon, Android the manifest. -->
  <link rel="apple-touch-icon" href="app/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Pregame">
  <meta name="theme-color" content="#080808">
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <header class="top">
    <a href="#/scout" class="brand" aria-label="Pregame home"><span class="wordmark">PREGAME</span></a>
    <nav class="tabs">
      <a href="#/results" data-page="results">Results</a>
      <a href="#/ladder" data-page="ladder">Ladder</a>
      <a href="#/stats" data-page="stats">Stats</a>
      <a href="#/scout" data-page="scout">Scout</a>
    </nav>
    <div class="pickers">
      <select id="league" aria-label="League"></select>
      <select id="competition" aria-label="Competition"></select>
      <select id="season" aria-label="Season"></select>
    </div>
  </header>
  <main id="app"></main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
